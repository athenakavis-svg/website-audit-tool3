<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Health Check</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="/styles.css">
<style>#report{display:block}</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <div class="brand">Website Health Check</div>
    <div class="by">Independent &middot; Not affiliated with GoDaddy</div>
  </div>
</header>

<main class="wrap">
  <section id="report" aria-live="polite">
    <div class="loading-page" id="loading">Loading report&hellip;</div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="f-main">
      <div class="f-title">Built independently by a GoDaddy employee</div>
      <div class="f-note">A personal project, created on personal time and outside the scope of employment.</div>
    </div>
    <div class="f-side">
      <span class="f-tag">Not a GoDaddy product</span>
      <span class="f-fine">Not endorsed, sponsored or approved by GoDaddy Inc.</span>
    </div>
  </div>
</footer>

<script src="/app.js"></script>
<script>
const $ = s => document.querySelector(s);

function idFromLocation(){
  // /r/abc123  or  /report.html?id=abc123
  const m = location.pathname.match(/\/r\/([a-z0-9]+)/i);
  if (m) return m[1];
  return new URLSearchParams(location.search).get('id') || '';
}

function fail(msg){
  $('#report').innerHTML =
    '<div class="report-head"><div><h2>Report unavailable</h2></div></div>' +
    '<p class="pending" style="color:var(--crit)">' + esc(msg) + '</p>' +
    '<p class="src">If someone sent you this link, ask them to generate a new one.</p>';
}

(async function(){
  const id = idFromLocation();
  if (!id){ fail('No report was specified in this link.'); return; }

  try {
    const res = await fetch(REPORT_ENDPOINT + '?id=' + encodeURIComponent(id));
    const rec = await readJson(res, 'report');
    if (rec.error){ fail(rec.error); return; }

    const d = rec.audit;
    const host = new URL(d.finalUrl).hostname;

    $('#report').innerHTML =
      '<div class="report-head"><div>' +
        '<h2>' + esc(host) + '</h2>' +
        '<div class="when">Checked ' + new Date(d.scannedAt).toLocaleString() +
          (d.platform && d.platform.detected && d.platform.detected.length
            ? ' &middot; built on ' + esc(d.platform.detected.join(', ')) : '') +
        '</div></div>' +
        '<div class="actions"><button onclick="window.print()">Save as PDF</button></div>' +
      '</div>' +
      bylineHtml(rec.author, rec.savedAt) +
      auditHtml(d) +
      psiHtml(rec.psi) +
      disclaimerHtml();

    $('#report').classList.add('on');
    document.title = host + ' — Website Health Check';
  } catch (err) {
    fail(err.message || 'This report could not be loaded.');
  }
})();
</script>
<script>
// Printing should never hide folded detail.
(function(){
  let reopened = [];
  addEventListener('beforeprint', () => {
    reopened = [...document.querySelectorAll('details:not([open])')];
    reopened.forEach(d => d.open = true);
  });
  addEventListener('afterprint', () => { reopened.forEach(d => d.open = false); reopened = []; });
})();
</script>
</body>
</html>
